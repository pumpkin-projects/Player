<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0e">
<title>Moonlit</title>
<meta name="apple-mobile-web-app-title" content="Moonlit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root {
  --bg: #fff;
  --fg: #111;
  --mut: #8a8a90;
  --card: #f2f2f5;
  --red: #fa243c;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0e;
    --fg: #f5f5f7;
    --mut: #8e8e93;
    --card: #1c1c21;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0e;
  --fg: #f5f5f7;
  --mut: #8e8e93;
  --card: #1c1c21;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  width: 100%;
  height: 100%;
  min-height: 100lvh;
  background: var(--bg);
}
body {
  margin: 0;
  width: 100%;
  min-height: 100lvh;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
  padding-top: var(--sat);
  padding-bottom: var(--sab);
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  transition: transform .15s;
}
button:active { transform: scale(.92); }
svg { fill: currentColor; display: block; }

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 6px;
  position: relative;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -.5px;
}
.brand span {
  background: linear-gradient(90deg, var(--fg), #b9a6ff, var(--fg));
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 6s linear infinite;
}
@keyframes shine { to { background-position: -200% 0; } }
.moonlogo {
  width: 30px;
  height: 30px;
  animation: float 4.5s ease-in-out infinite;
  filter: drop-shadow(0 0 8px rgba(255,214,140,.55));
}
@keyframes float { 50% { transform: translateY(-3px) rotate(-8deg); } }
.tw { animation: tw 2.4s ease-in-out infinite; }
.tw.d { animation-delay: -1.2s; }
@keyframes tw { 50% { opacity: .2; } }

.add {
  background: var(--red);
  color: #fff;
  border-radius: 20px;
  padding: 9px 16px;
  font-weight: 600;
  font-size: 15px;
}

/* Search & Library */
#sbar {
  display: none;
  align-items: center;
  gap: 10px;
  margin: 8px 20px;
  padding: 0 14px;
  height: 42px;
  border-radius: 12px;
  background: var(--card);
  color: var(--mut);
}
body.pg-search #sbar { display: flex; }
#sbar svg { width: 18px; height: 18px; flex: none; }
#sbar input {
  flex: 1;
  background: none;
  border: 0;
  outline: 0;
  color: var(--fg);
  font: inherit;
  font-size: 16px;
  min-width: 0;
  -webkit-appearance: none;
}
#list { padding: 8px 0 calc(200px + var(--sab)); }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 20px;
  transition: background .2s;
}
.row:active { background: var(--card); }
.row.on .t { color: var(--red); }
.th {
  width: 54px;
  height: 54px;
  border-radius: 8px;
  background: var(--card) center/cover;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
  flex: none;
}
.t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a { color: var(--mut); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row > div:nth-child(2) { min-width: 0; flex: 1; }
.del { color: var(--mut); font-size: 22px; padding: 6px; }
.chev { color: var(--mut); font-size: 26px; padding: 0 4px; }
.empty { text-align: center; color: var(--mut); padding: 90px 40px; }
.empty b { display: block; color: var(--fg); font-size: 20px; margin-bottom: 8px; }
.sec {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 18px 20px 6px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.3px;
  border-bottom: 1px solid var(--card);
  margin-bottom: 4px;
}
.sec span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec i { font-style: normal; font-size: 13px; font-weight: 600; color: var(--mut); padding-left: 10px; }
.gh { display: flex; align-items: center; gap: 12px; padding: 6px 20px 10px; }
.gh button {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--card); display: flex; align-items: center; justify-content: center;
}
.gh svg { width: 20px; height: 20px; transform: rotate(90deg); }
.gh b { display: block; font-size: 22px; letter-spacing: -.3px; }
.gh span { color: var(--mut); font-size: 13px; }

.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 6px; }
.eq b { width: 3px; height: 3px; background: var(--red); border-radius: 1px; }
body.pl .eq b { animation: eq .9s ease-in-out infinite; }
.eq b:nth-child(2) { animation-delay: -.3s !important; }
.eq b:nth-child(3) { animation-delay: -.6s !important; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

/* Floating Dock & Mini Player */
#menu {
  position: fixed;
  left: 50%;
  bottom: calc(var(--sab) + 88px);
  transform: translateX(-50%) scale(.9);
  transform-origin: bottom center;
  z-index: 6;
  background: var(--card);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  opacity: 0;
  pointer-events: none;
  transition: .18s;
}
#menu.open { transform: translateX(-50%); opacity: 1; pointer-events: auto; }
#menu button { display: block; width: 100%; text-align: left; padding: 12px 18px; font-weight: 600; border-radius: 9px; white-space: nowrap; }
#menu button:active { background: rgba(255,255,255,.1); }

#dock {
  position: fixed;
  left: 50%;
  bottom: calc(var(--sab) + 10px);
  transform: translateX(-50%);
  z-index: 7;
  display: flex;
  gap: 6px;
  padding: 8px;
  border-radius: 36px;
  background: rgba(44,44,54,.68);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.09);
  animation: dockin .6s cubic-bezier(.2,.8,.2,1);
}
@keyframes dockin { from { transform: translate(-50%, 160%); } }
#dock button {
  width: 70px; height: 54px; border-radius: 28px;
  display: flex; align-items: center; justify-content: center;
  color: #9a9aa3; transition: background .25s, color .25s, transform .15s;
}
#dock button.on { background: rgba(255,255,255,.15); color: #fff; }
#dock svg { width: 27px; height: 27px; transition: transform .25s; }
#plusb.on svg { transform: rotate(45deg); }

#mini {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: calc(var(--sab) + 84px);
  background: var(--card);
  border-radius: 16px;
  padding: 8px 14px 8px 8px;
  display: none;
  align-items: center;
  gap: 12px;
  box-shadow: 0 6px 30px rgba(0,0,0,.35);
  z-index: 5;
  animation: up .45s cubic-bezier(.2,.8,.2,1);
}
@keyframes up { from { transform: translateY(120%); opacity: 0; } }
#mini .th { width: 44px; height: 44px; }
#mini .m { flex: 1; min-width: 0; }
#mini button { padding: 6px; }
#mini svg { width: 26px; height: 26px; }

body.so header, body.so #list, body.so #prog, body.so #sbar, body.so #dock, body.so #menu, body.so #mini {
  display: none !important;
}

/* ==========================================================================
   FULL-SCREEN NOW PLAYING SHEET — EDGE-TO-EDGE iOS VIEWPORT FIX
   ========================================================================== */
#sheet {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100lvh;
  min-height: 100lvh;
  z-index: 10;
  color: #fff;
  background: #141820;
  transform: translateY(100%);
  transition: transform .38s cubic-bezier(.2,.8,.2,1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-top: max(var(--sat), 10px);
  padding-bottom: max(var(--sab), 10px);
  overflow: hidden;
}
#sheet.open { transform: translateY(0); }
#sheet.drag { transition: none; }

/* Full-bleed blurred artwork layer covering behind Dynamic Island AND Home Indicator */
#bg-wrap {
  position: fixed;
  top: -60px;
  left: -60px;
  right: -60px;
  bottom: -120px;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
#bg {
  position: absolute;
  inset: 0;
  background: #2a3a3c center/cover no-repeat;
  filter: blur(70px) saturate(1.55) brightness(.68);
  transform: scale(1.25);
  transition: background-image .5s ease;
}
#bg-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,.38) 65%, rgba(0,0,0,.55) 100%);
}
#sheet > *:not(#bg-wrap) {
  position: relative;
  z-index: 1;
}

.grab {
  width: 44px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255,255,255,.45);
  margin: 6px auto 6px;
  flex: 0 0 auto;
  cursor: pointer;
}

/* Artwork view */
#art {
  display: none;
  flex: 1 1 auto;
  min-height: 0;
  align-items: center;
  justify-content: center;
  padding: 6px 32px;
}
#sheet.artmode #art { display: flex; }
#bigart {
  width: 100%;
  max-width: min(360px, 42vh);
  aspect-ratio: 1;
  border-radius: 16px;
  background: #222 center/cover;
  box-shadow: 0 24px 60px rgba(0,0,0,.55);
  transition: transform .55s cubic-bezier(.2,.8,.2,1);
  transform: scale(.86);
}
#sheet.pl #bigart { transform: scale(1); }

/* Track Info Row */
#meta {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 22px 4px;
  flex: 0 0 auto;
}
#meta .m { flex: 1; min-width: 0; }
#meta .th { width: 52px; height: 52px; border-radius: 9px; flex: none; cursor: pointer; }
#sheet.artmode #meta .th { display: none; }
.ttl {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.2px;
  white-space: nowrap;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent);
  mask-image: linear-gradient(90deg, #000 88%, transparent);
}
.ttl span { display: inline-block; padding-right: 36px; }
.ttl.mq span { animation: mq 11s ease-in-out infinite alternate; }
@keyframes mq { 0%, 14% { transform: none; } 86%, 100% { transform: translateX(calc(var(--d) * -1)); } }
#meta .a { color: rgba(255,255,255,.65); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#meta button {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,.14);
  display: flex; align-items: center; justify-content: center;
  color: #fff; flex: none;
}
#meta button svg { width: 20px; height: 20px; }
#fav.on path { fill: currentColor; }

/* Synced Lyrics View */
#lyr {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10vh 22px 24vh;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 84%, transparent);
  mask-image: linear-gradient(transparent, #000 12%, #000 84%, transparent);
  -webkit-user-select: none;
  user-select: none;
}
#lyr::-webkit-scrollbar { display: none; }
#sheet.artmode #lyr, #sheet.qmode #lyr { display: none; }
#lyr.empty {
  overflow: hidden;
  padding: 0 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  -webkit-mask-image: none;
  mask-image: none;
}
.nol { opacity: .65; font-size: 19px; font-weight: 600; text-align: center; }
.l {
  font-size: 29px;
  font-weight: 800;
  line-height: 1.18;
  letter-spacing: -.4px;
  padding: 9px 0;
  opacity: .38;
  filter: blur(calc(var(--d, 0) * .55px));
  transform-origin: left;
  transition: opacity .35s, filter .35s, transform .35s;
  cursor: pointer;
}
.l.on { opacity: 1; filter: none; transform: scale(1.03); text-shadow: 0 0 28px rgba(255,255,255,.4); }
.l.plain { filter: none; opacity: .85; font-size: 21px; font-weight: 700; }
#lyr.user .l { filter: none; opacity: .62; }
#lyr.user .l.on { opacity: 1; }

/* Queue View */
#qwrap {
  display: none;
  flex: 1 1 0;
  min-height: 0;
  flex-direction: column;
}
#sheet.qmode #art { display: none; }
#sheet.qmode #qwrap { display: flex; }
.qh { display: flex; justify-content: space-between; align-items: center; padding: 6px 22px; flex: none; }
.qh b { font-size: 21px; }
.qh button {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.14); margin-left: 8px;
  display: inline-flex; align-items: center; justify-content: center; color: #fff;
}
.qh svg { width: 20px; height: 20px; }
.qh .tg.act { background: #fff; color: #111; }
#qlist { flex: 1; overflow-y: auto; min-height: 0; padding: 0 22px 12px; overscroll-behavior: contain; scrollbar-width: none; }
.qt { font-size: 14px; font-weight: 700; color: rgba(255,255,255,.6); padding: 6px 0; }
.qr { display: flex; align-items: center; gap: 12px; padding: 6px 0; cursor: pointer; }
.qr .th { width: 46px; height: 46px; border-radius: 7px; flex: none; }
.qr .m { min-width: 0; }
.qr .t { font-weight: 600; }
.qr .a { color: rgba(255,255,255,.6); font-size: 14px; }

/* Player Bottom Controls Stack (guaranteed visible above Home Indicator) */
.controls-dock {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.bar { padding: 4px 22px 0; }
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, #fff var(--p, 0%), rgba(255,255,255,.3) var(--p, 0%));
  outline: 0;
  margin: 8px 0;
}
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 0; height: 0; }
.tm {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: rgba(255,255,255,.65);
  font-variant-numeric: tabular-nums;
}
.ctl {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 54px 4px;
}
.ctl button { padding: 8px; opacity: .92; }
.ctl svg { width: 44px; height: 44px; }
.ctl .big svg { width: 66px; height: 66px; }

.vol {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 28px 0;
  color: rgba(255,255,255,.72);
}
.vol svg { width: 20px; height: 20px; flex: none; }
.vol input { flex: 1; }

.bot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 46px 4px;
}
.bot button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,.85);
}
.bot button.on { background: rgba(255,255,255,.28); color: #fff; }
.bot svg { width: 25px; height: 25px; }

/* Context Menu inside Sheet */
#sheet > #mm {
  position: absolute;
  z-index: 20;
  right: 22px;
  background: rgba(44,44,50,.94);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-radius: 14px;
  padding: 6px;
  opacity: 0;
  pointer-events: none;
  transform: scale(.92);
  transform-origin: top right;
  transition: .16s;
}
#sheet > #mm.open { opacity: 1; pointer-events: auto; transform: none; }
#mm button { display: block; width: 100%; text-align: left; padding: 12px 16px; font-weight: 600; border-radius: 9px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="moonlogo" viewBox="0 0 24 24">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe9"/><stop offset="1" stop-color="#ffc979"/></linearGradient></defs>
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="url(#mg)"/>
      <circle class="tw" cx="19.5" cy="5" r="1.1" fill="#fff"/>
      <circle class="tw d" cx="22" cy="9" r=".7" fill="#fff"/>
    </svg>
    <span>Moonlit</span>
  </div>
</header>

<div id="prog" style="padding:0 20px;color:var(--mut);font-size:14px"></div>
<input type="file" id="file" multiple hidden>
<input type="file" id="lf" hidden>
<input type="file" id="dir" webkitdirectory multiple hidden>

<div id="sbar">
  <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3a1.1 1.1 0 0 1-1.6 1.6l-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2.2a5.3 5.3 0 1 0 0 10.6 5.3 5.3 0 0 0 0-10.6z"/></svg>
  <input id="q" type="search" placeholder="Search songs, artists" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<div id="list"></div>

<div id="menu">
  <button id="addb">Add songs</button>
  <button id="addf">Add folder</button>
</div>

<nav id="dock">
  <button id="nsearch" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3a1.1 1.1 0 0 1-1.6 1.6l-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2.2a5.3 5.3 0 1 0 0 10.6 5.3 5.3 0 0 0 0-10.6z"/></svg></button>
  <button id="plusb" aria-label="Add music"><svg viewBox="0 0 24 24"><path d="M12 4.5a1.2 1.2 0 0 1 1.2 1.2v5.1h5.1a1.2 1.2 0 0 1 0 2.4h-5.1v5.1a1.2 1.2 0 0 1-2.4 0v-5.1H5.7a1.2 1.2 0 0 1 0-2.4h5.1V5.7A1.2 1.2 0 0 1 12 4.5z"/></svg></button>
  <button id="nlib" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.9c.6 0 1.2.3 1.6.8l1 1.2h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg></button>
</nav>

<div id="mini">
  <div class="th" id="mth"></div>
  <div class="m"><div class="t" id="mt"></div><div class="a" id="ma"></div></div>
  <button id="mp" aria-label="Play or pause"></button>
  <button id="mn" aria-label="Next"></button>
</div>

<div id="sheet" class="artmode">
  <div id="bg-wrap">
    <div id="bg"></div>
    <div id="bg-shade"></div>
  </div>

  <div class="grab" id="grab"></div>

  <div id="art"><div id="bigart"></div></div>

  <div id="meta">
    <div class="th" id="sth"></div>
    <div class="m">
      <div class="ttl" id="st"><span></span></div>
      <div class="a" id="sa"></div>
    </div>
    <button id="fav" aria-label="Favorite"><svg viewBox="0 0 24 24"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6 6.9 19.3l1-5.7-4.1-4 5.7-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    <button id="more" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg></button>
  </div>

  <div id="lyr"></div>

  <div id="qwrap">
    <div class="qh">
      <b>Up Next</b>
      <div>
        <button class="tg" id="sh" aria-label="Shuffle"></button>
        <button class="tg" id="rp" aria-label="Repeat"></button>
      </div>
    </div>
    <div id="qlist"></div>
  </div>

  <div class="controls-dock">
    <div class="bar">
      <input type="range" id="seek" min="0" max="1000" value="0">
      <div class="tm"><span id="tc">0:00</span><span id="td">0:00</span></div>
    </div>
    <div class="ctl">
      <button id="pv" aria-label="Previous"></button>
      <button class="big" id="pp" aria-label="Play or pause"></button>
      <button id="nx" aria-label="Next"></button>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9.5v5h3.2L11 18.5v-13L6.2 9.5z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="100" style="--p:100%">
      <svg viewBox="0 0 24 24"><path d="M3 9.5v5h3.2L11 18.5v-13L6.2 9.5z"/><path d="M14.5 8.5a5 5 0 0 1 0 7M17 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="bot">
      <button id="lyrbtn" aria-label="Lyrics"><svg viewBox="0 0 24 24"><path d="M5 3h14a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-6.5L8 21.7a.6.6 0 0 1-1-.5V18H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M8.2 7.5h2.6v3L9.5 13H8.3l.8-2.1H8.2zm5 0h2.6v3L14.5 13h-1.2l.8-2.1h-.9z" fill="#000" opacity=".55"/></svg></button>
      <button id="qbtn" aria-label="Queue"><svg viewBox="0 0 24 24"><circle cx="4" cy="6" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="4" cy="18" r="1.6"/><rect x="8" y="4.8" width="14" height="2.4" rx="1.2"/><rect x="8" y="10.8" width="14" height="2.4" rx="1.2"/><rect x="8" y="16.8" width="14" height="2.4" rx="1.2"/></svg></button>
    </div>
  </div>

  <div id="mm">
    <button id="mlrc">Add lyrics file (.lrc)</button>
    <button id="mdel">Remove from library</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const I = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M4 6.5v11a1 1 0 0 0 1.5.9L13 13.4V17.5a1 1 0 0 0 1.5.9l7-5.5a1 1 0 0 0 0-1.8l-7-5.5A1 1 0 0 0 13 6.5v4.1L5.5 5.6A1 1 0 0 0 4 6.5z"/><rect x="19" y="5" width="2.4" height="14" rx="1"/></svg>',
  prev: '<svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M4 6.5v11a1 1 0 0 0 1.5.9L13 13.4V17.5a1 1 0 0 0 1.5.9l7-5.5a1 1 0 0 0 0-1.8l-7-5.5A1 1 0 0 0 13 6.5v4.1L5.5 5.6A1 1 0 0 0 4 6.5z"/><rect x="19" y="5" width="2.4" height="14" rx="1"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M5.3 8.3a1 1 0 0 1 1.4 0L12 13.6l5.3-5.3a1 1 0 1 1 1.4 1.4l-6 6a1 1 0 0 1-1.4 0l-6-6a1 1 0 0 1 0-1.4z"/></svg>',
  shuf: '<svg viewBox="0 0 24 24"><path d="M3 7h3.5c1.6 0 3 .8 3.9 2.1l3.2 4.8c.5.7 1.3 1.1 2.2 1.1H18v-2.5l4 3.5-4 3.5V17h-2.2c-1.6 0-3-.8-3.9-2.1l-3.2-4.8C8.2 9.4 7.4 9 6.5 9H3zM3 15h3.5c.7 0 1.3-.3 1.8-.8l.9-1.2-1.2-1.9-.8 1.2c-.1.2-.4.2-.7.2H3zm12-8.2c.8 0 1.5.4 2 1l.3.4-1.2 1.8-.5-.7c-.2-.3-.5-.5-.9-.5H13l-1-1.5.4-.5c.5-.7 1.2-1 2-1zM18 4v2.5l4-3.5-4-3.5z" transform="translate(0 3)"/></svg>',
  rep: '<svg viewBox="0 0 24 24"><path d="M7 7h10v2.5l4-3.5-4-3.5V5H6a3 3 0 0 0-3 3v4h2V8a1 1 0 0 1 1-1zm10 10H7v-2.5L3 18l4 3.5V19h11a3 3 0 0 0 3-3v-4h-2v4a1 1 0 0 1-1 1z"/></svg>'
};
const RW = '<svg viewBox="0 0 24 24"__X__><path d="M11.5 6.2v11.6a.9.9 0 0 1-1.4.75L2.3 12.75a.9.9 0 0 1 0-1.5l7.8-5.8a.9.9 0 0 1 1.4.75zM21.7 6.2v11.6a.9.9 0 0 1-1.4.75l-7.8-5.8a.9.9 0 0 1 0-1.5l7.8-5.8a.9.9 0 0 1 1.4.75z"/></svg>';
I.rew = RW.replace("__X__", "");
I.ffw = RW.replace("__X__", ' style="transform:scaleX(-1)"');

let db = null, songs = [], cur = -1, lines = [], ai = -2, shuf = false, rep = 0, seeking = false;
let page = "home", group = null, sy = 0;
const au = new Audio();
au.preload = "auto";

/* IndexedDB Storage */
function openDB() {
  return new Promise(r => {
    try {
      const q = indexedDB.open("localplayer", 1);
      q.onupgradeneeded = () => q.result.createObjectStore("s", { keyPath: "id" });
      q.onsuccess = () => r(q.result);
      q.onerror = () => r(null);
    } catch (e) { r(null); }
  });
}
const tx = (m, f) => new Promise(r => {
  if (!db) return r([]);
  try {
    const o = db.transaction("s", m).objectStore("s");
    const q = f(o);
    q.onsuccess = () => r(q.result);
    q.onerror = () => r([]);
  } catch (e) { r([]); }
});
const rec = s => ({ id: s.id, key: s.key, title: s.title, artist: s.artist, album: s.album, folder: s.folder, blob: s.blob, artBlob: s.artBlob, lrc: s.lrc, fav: s.fav });
const put = s => tx("readwrite", o => o.put(s));
const del = id => tx("readwrite", o => o.delete(id));

/* Helpers */
const base = n => n.replace(/\.[^.]+$/, "").toLowerCase().trim();
const nk = n => String(n).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
const fmt = t => { if (!isFinite(t) || t < 0) return "0:00"; t = Math.floor(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function folderOf(f) { const p = (f.webkitRelativePath || "").split("/"); return p.length > 1 ? p[p.length - 2] : "Imported"; }
function readTags(f) { return new Promise(r => { try { window.jsmediatags.read(f, { onSuccess: t => r(t.tags), onError: () => r({}) }); } catch (e) { r({}); } }); }
function artOf(s) { if (!s || !s.artBlob) return ""; return s.artUrl || (s.artUrl = URL.createObjectURL(s.artBlob)); }
function setLrc(s, t) { s.lrc = t; put(rec(s)); if (songs[cur] === s) loadLyrics(s); }

function parseLRC(txt) {
  const out = [], re = /\[(\d+):(\d+(?:[.:]\d+)?)\]/g;
  let synced = false;
  for (const raw of String(txt || "").split(/?
/)) {
    const ts = [...raw.matchAll(re)];
    const text = raw.replace(re, "").trim();
    if (ts.length) {
      synced = true;
      for (const m of ts) out.push({ t: +m[1] * 60 + parseFloat(m[2].replace(":", ".")), s: text });
    } else if (text && !/^\[[a-z]+:/i.test(text)) {
      out.push({ t: null, s: text });
    }
  }
  return synced ? out.filter(l => l.t !== null && l.s !== "").sort((a, b) => a.t - b.t) : out;
}

/* Import Songs & Folders */
$("#addb").onclick = () => $("#file").click();
$("#addf").onclick = () => $("#dir").click();
$("#file").onchange = e => { const f = [...e.target.files]; e.target.value = ""; addFiles(f); };
$("#dir").onchange = e => { const f = [...e.target.files]; e.target.value = ""; addFiles(f); };

async function addFiles(all) {
  const fs = all.filter(f => /\.(lrc|txt)$/i.test(f.name) || (f.type || "").startsWith("audio") || /\.(mp3|m4a|aac|wav|flac|ogg|opus|aif|aiff|wma|mp4)$/i.test(f.name));
  const lrcs = {};
  for (const f of fs) {
    if (/\.lrc$/i.test(f.name) || /\.txt$/i.test(f.name)) lrcs[nk(base(f.name))] = await f.text();
  }
  const nAud = fs.filter(f => !/\.(lrc|txt)$/i.test(f.name)).length;
  let done = 0;
  const pickL = k => {
    if (lrcs[k] !== undefined) return lrcs[k];
    const ks = Object.keys(lrcs);
    const m = nAud > 3 ? null : ks.find(x => x && k && (x.includes(k) || k.includes(x)));
    if (m) return lrcs[m];
    return ks.length === 1 && nAud === 1 ? lrcs[ks[0]] : "";
  };
  for (const f of fs) {
    if (/\.(lrc|txt)$/i.test(f.name)) continue;
    $("#prog").textContent = "Adding " + (++done) + " of " + nAud + "…";
    await new Promise(r => setTimeout(r, 0));
    const ex = songs.find(x => nk(x.key) === nk(base(f.name)));
    if (ex) {
      const L0 = pickL(nk(base(f.name)));
      if (L0) setLrc(ex, L0);
      if (!ex.album) {
        const t2 = await readTags(f);
        ex.album = t2.album || "Unknown album";
        ex.folder = folderOf(f);
        put(rec(ex));
      }
      continue;
    }
    const tg = await readTags(f);
    const emb = tg.lyrics && (tg.lyrics.lyrics || (typeof tg.lyrics === "string" ? tg.lyrics : "")) || "";
    const artBlob = tg.picture ? new Blob([new Uint8Array(tg.picture.data)], { type: tg.picture.format || "image/jpeg" }) : null;
    const s = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      key: base(f.name),
      title: tg.title || f.name.replace(/\.[^.]+$/, ""),
      artist: tg.artist || "Unknown artist",
      album: tg.album || "Unknown album",
      folder: folderOf(f),
      blob: f,
      artBlob,
      lrc: pickL(nk(base(f.name))) || emb || ""
    };
    songs.push(s);
    put(rec(s));
  }
  if (!nAud) {
    for (const k in lrcs) {
      let s = songs.find(x => nk(x.key) === k) || songs.find(x => { const a = nk(x.key); return a && (a.includes(k) || k.includes(a)); });
      if (!s && Object.keys(lrcs).length === 1 && cur >= 0) s = songs[cur];
      if (s) setLrc(s, lrcs[k]);
    }
  }
  $("#prog").textContent = "";
  render();
}

/* Library Rendering */
function sortSongs() {
  const c = songs[cur];
  songs.sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: "base" }));
  cur = c ? songs.indexOf(c) : -1;
}

function render() {
  sortSongs();
  const L = $("#list");
  if (!songs.length) {
    L.innerHTML = '<div class="empty"><b>No songs yet</b>Tap the + button below to add songs or a whole folder. Pick matching .lrc files too for synced lyrics.</div>';
    return;
  }
  const row = (s, i) => `<div class="row${i === cur ? " on" : ""}" data-i="${i}"><div class="th" style="background-image:url('${artOf(s)}')"></div><div><div class="t">${i === cur ? '<i class="eq"><b></b><b></b><b></b></i>' : ""}${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div><button class="del" data-d="${i}" aria-label="Remove">×</button></div>`;
  const KF = { albums: s => s.album || "Unknown album", artists: s => s.artist || "Unknown artist", folders: s => s.folder || "Imported" };
  const idx = songs.map((_, i) => i);
  let html = "";

  if (page === "search") {
    const q = $("#q").value.trim().toLowerCase();
    if (!q) html = '<div class="empty">Search your songs, artists and albums</div>';
    else {
      const r = idx.filter(i => (songs[i].title + " " + songs[i].artist + " " + (songs[i].album || "")).toLowerCase().includes(q));
      html = r.length ? r.map(i => row(songs[i], i)).join("") : '<div class="empty">No results</div>';
    }
  } else if (page === "lib") {
    if (group) {
      const r = idx.filter(i => KF[group.t](songs[i]) === group.k);
      html = '<div class="gh"><button id="back" aria-label="Back">' + I.down + '</button><div><b>' + esc(group.k) + '</b><span>' + r.length + ' songs</span></div></div>' + r.map(i => row(songs[i], i)).join("");
    } else {
      const T = { albums: "Albums", folders: "Folders", artists: "Artists" };
      for (const t of ["albums", "folders", "artists"]) {
        const g = new Map();
        idx.forEach(i => { const k = KF[t](songs[i]); if (!g.has(k)) g.set(k, []); g.get(k).push(i); });
        const ks = [...g.keys()].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
        html += '<div class="sec"><span>' + T[t] + '</span><i>' + ks.length + '</i></div>' + ks.map(k => {
          const m = g.get(k);
          return `<div class="row" data-g="${esc(k)}" data-t="${t}"><div class="th" style="background-image:url('${artOf(songs[m[0]])}')"></div><div><div class="t">${esc(k)}</div><div class="a">${m.length} song${m.length > 1 ? "s" : ""}</div></div><span class="chev">›</span></div>`;
        }).join("");
      }
    }
  } else {
    html = idx.map(i => row(songs[i], i)).join("");
  }
  L.innerHTML = html;
}

$("#list").onclick = async e => {
  if (e.target.closest("#back")) { group = null; render(); return; }
  const gr = e.target.closest("[data-g]");
  if (gr) { group = { t: gr.dataset.t, k: gr.dataset.g }; render(); scrollTo(0, 0); return; }
  const d = e.target.closest("[data-d]");
  if (d) {
    const i = +d.dataset.d, s = songs[i];
    if (i === cur) { au.pause(); au.removeAttribute("src"); cur = -1; $("#mini").style.display = "none"; setSheet(false); }
    else if (i < cur) cur--;
    await del(s.id);
    songs.splice(i, 1);
    render();
    return;
  }
  const r = e.target.closest("[data-i]");
  if (r) play(+r.dataset.i);
};

/* Playback & Lyrics Sync */
function play(i) {
  const s = songs[i];
  if (!s) return;
  cur = i;
  if (!s.url) s.url = URL.createObjectURL(s.blob);
  au.src = s.url;
  au.play().catch(() => {});
  const art = artOf(s), bgi = art ? `url('${art}')` : "none";
  for (const id of ["#mth", "#sth", "#bigart"]) $(id).style.backgroundImage = bgi;
  $("#bg").style.backgroundImage = bgi;
  $("#mt").textContent = s.title;
  $("#ma").textContent = $("#sa").textContent = s.artist;
  setTitle(s.title);
  $("#fav").classList.toggle("on", !!s.fav);
  $("#mini").style.display = "flex";
  loadLyrics(s);
  render();
  if ($("#sheet").classList.contains("qmode")) buildQ();
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.title,
        artist: s.artist,
        artwork: art ? [{ src: art, sizes: "512x512", type: s.artBlob.type }] : []
      });
    } catch (e) {}
  }
}

function loadLyrics(s) {
  lines = parseLRC(s.lrc);
  ai = -2;
  const box = $("#lyr");
  box.scrollTop = 0;
  box.classList.toggle("empty", !lines.length);
  if (!lines.length) {
    box.innerHTML = '<div class="nol">No lyrics for this song<br><button class="add" id="al" style="margin-top:16px">Add .lrc file</button></div>';
    return;
  }
  const plain = lines[0].t === null;
  box.innerHTML = lines.map((l, i) => `<div class="l${plain ? " plain" : ""}" data-i="${i}">${esc(l.s)}</div>`).join("");
}

$("#lyr").onclick = e => {
  if (e.target.id === "al") { $("#lf").click(); return; }
  const l = e.target.closest(".l");
  if (!l) return;
  const x = lines[+l.dataset.i];
  if (x && x.t !== null) { au.currentTime = x.t; au.play(); }
};

function sync() {
  if (!lines.length || lines[0].t === null) return;
  const t = au.currentTime + .15;
  let k = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].t <= t) k = i;
    else break;
  }
  if (k === ai) return;
  ai = k;
  const els = $("#lyr").children;
  for (let i = 0; i < els.length; i++) {
    els[i].style.setProperty("--d", Math.min(Math.abs(i - k), 6));
    els[i].classList.toggle("on", i === k);
  }
  if (k >= 0 && !$("#lyr").classList.contains("user")) {
    const box = $("#lyr"), el = els[k];
    box.scrollTo({ top: el.offsetTop - box.clientHeight * .28, behavior: "smooth" });
  }
}

function next(auto) {
  if (!songs.length) return;
  if (auto && rep === 2) { au.currentTime = 0; au.play(); return; }
  let n;
  if (shuf && songs.length > 1) {
    do { n = Math.floor(Math.random() * songs.length); } while (n === cur);
  } else {
    n = cur + 1;
    if (n >= songs.length) {
      if (auto && rep === 0) { au.pause(); return; }
      n = 0;
    }
  }
  play(n);
}

function prev() {
  if (au.currentTime > 3) { au.currentTime = 0; return; }
  play(cur > 0 ? cur - 1 : songs.length - 1);
}

const toggle = () => { if (cur < 0) return; au.paused ? au.play() : au.pause(); };
au.onended = () => next(true);
au.ontimeupdate = () => {
  const d = au.duration || 0;
  $("#tc").textContent = fmt(au.currentTime);
  $("#td").textContent = "−" + fmt(d - au.currentTime);
  if (!seeking && d) {
    const v = au.currentTime / d * 1000;
    $("#seek").value = v;
    $("#seek").style.setProperty("--p", v / 10 + "%");
  }
  sync();
};

const setIcons = () => {
  const p = au.paused ? I.play : I.pause;
  $("#mp").innerHTML = p;
  $("#pp").innerHTML = p;
  document.body.classList.toggle("pl", !au.paused);
  $("#sheet").classList.toggle("pl", !au.paused);
};
au.onplay = au.onpause = setIcons;

const sk = $("#seek");
sk.oninput = () => { seeking = true; sk.style.setProperty("--p", sk.value / 10 + "%"); $("#tc").textContent = fmt(sk.value / 1000 * (au.duration || 0)); };
sk.onchange = () => { if (au.duration) au.currentTime = sk.value / 1000 * au.duration; seeking = false; };

/* UI Controls & Sheet Gestures */
$("#mp").onclick = e => { e.stopPropagation(); toggle(); };
$("#mn").onclick = e => { e.stopPropagation(); next(); };
$("#mini").onclick = () => setSheet(true);
$("#grab").onclick = () => setSheet(false);
$("#pp").onclick = toggle;
$("#nx").onclick = () => next();
$("#pv").onclick = prev;
$("#sh").onclick = () => { shuf = !shuf; $("#sh").classList.toggle("act", shuf); };
$("#rp").onclick = () => {
  rep = (rep + 1) % 3;
  $("#rp").classList.toggle("act", rep > 0);
  $("#rp").style.opacity = rep === 2 ? "1" : "";
  $("#rp").innerHTML = I.rep + (rep === 2 ? '<span style="position:absolute;font-size:10px;font-weight:800;margin:-24px 0 0 14px">1</span>' : "");
};

if ("mediaSession" in navigator) {
  const m = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  m("play", () => au.play());
  m("pause", () => au.pause());
  m("previoustrack", prev);
  m("nexttrack", () => next());
  m("seekto", d => { au.currentTime = d.seekTime; });
}

$("#lf").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f && songs[cur]) setLrc(songs[cur], await f.text());
};

function modeNow() {
  const c = $("#sheet").classList;
  return c.contains("qmode") ? "q" : c.contains("artmode") ? "art" : "lyr";
}
function setMode(m) {
  const s = $("#sheet");
  s.classList.toggle("artmode", m === "art");
  s.classList.toggle("qmode", m === "q");
  $("#lyrbtn").classList.toggle("on", m === "lyr");
  $("#qbtn").classList.toggle("on", m === "q");
  if (m === "q") buildQ();
  $("#mm").classList.remove("open");
  if (songs[cur]) requestAnimationFrame(() => setTitle(songs[cur].title));
}

$("#lyrbtn").onclick = () => setMode(modeNow() === "lyr" ? "art" : "lyr");
$("#qbtn").onclick = () => setMode(modeNow() === "q" ? "art" : "q");
$("#sth").onclick = () => setMode("art");

$("#plusb").onclick = e => { e.stopPropagation(); $("#menu").classList.toggle("open"); $("#plusb").classList.toggle("on"); };
$("#menu").onclick = () => { $("#menu").classList.remove("open"); $("#plusb").classList.remove("on"); };
document.addEventListener("click", e => {
  if (!e.target.closest("#menu, #plusb")) { $("#menu").classList.remove("open"); $("#plusb").classList.remove("on"); }
});

$("#q").oninput = () => render();
function setPage(p) {
  page = page === p ? "home" : p;
  group = null;
  const b = document.body.classList;
  b.remove("pg-search", "pg-lib");
  if (page !== "home") b.add("pg-" + page);
  $("#nsearch").classList.toggle("on", page === "search");
  $("#nlib").classList.toggle("on", page === "lib");
  if (page === "search") $("#q").focus();
  else { $("#q").value = ""; $("#q").blur(); }
  render();
  scrollTo(0, 0);
}
$("#nsearch").onclick = () => setPage("search");
$("#nlib").onclick = () => setPage("lib");

function setSheet(o) {
  const s = $("#sheet");
  if (o) {
    sy = scrollY;
    s.classList.add("open");
    document.body.classList.add("so");
  } else {
    s.classList.remove("open");
    document.body.classList.remove("so");
    scrollTo(0, sy);
  }
}

/* Swipe down to dismiss sheet */
let y0 = null, dy = 0;
const sh = $("#sheet");
sh.addEventListener("touchstart", e => {
  y0 = e.target.closest("#lyr, #seek, #vol, #qlist") ? null : e.touches[0].clientY;
  dy = 0;
}, { passive: true });
sh.addEventListener("touchmove", e => {
  if (y0 === null) return;
  dy = e.touches[0].clientY - y0;
  if (dy > 0) {
    sh.classList.add("drag");
    sh.style.transform = "translateY(" + dy + "px)";
  }
}, { passive: true });
sh.addEventListener("touchend", () => {
  if (y0 === null) return;
  sh.classList.remove("drag");
  sh.style.transform = "";
  if (dy > 110) setSheet(false);
  y0 = null;
});

function setTitle(t) {
  const el = $("#st");
  el.innerHTML = "<span></span>";
  const sp = el.firstChild;
  sp.textContent = t;
  el.classList.remove("mq");
  requestAnimationFrame(() => {
    const d = sp.scrollWidth - el.clientWidth;
    if (d > 4) {
      el.style.setProperty("--d", (d + 8) + "px");
      el.classList.add("mq");
    }
  });
}

function buildQ() {
  const q = $("#qlist");
  if (cur < 0) { q.innerHTML = ""; return; }
  let o = '<div class="qt">Playing Next</div>';
  for (let k = 1; k < songs.length; k++) {
    const i = (cur + k) % songs.length, s = songs[i];
    o += `<div class="qr" data-q="${i}"><div class="th" style="background-image:url('${artOf(s)}')"></div><div class="m"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div></div>`;
  }
  q.innerHTML = o;
}
$("#qlist").onclick = e => { const r = e.target.closest("[data-q]"); if (r) play(+r.dataset.q); };
$("#fav").onclick = () => { const s = songs[cur]; if (!s) return; s.fav = !s.fav; $("#fav").classList.toggle("on", s.fav); put(rec(s)); };
$("#more").onclick = e => {
  e.stopPropagation();
  const r = $("#more").getBoundingClientRect(), m = $("#mm");
  m.style.top = (r.bottom + 6) + "px";
  m.classList.toggle("open");
};
$("#mm").onclick = e => { e.stopPropagation(); $("#mm").classList.remove("open"); };
$("#sheet").addEventListener("click", e => { if (!e.target.closest("#more, #mm")) $("#mm").classList.remove("open"); });
$("#mlrc").onclick = () => $("#lf").click();
$("#mdel").onclick = async () => {
  const s = songs[cur];
  if (!s) return;
  au.pause();
  au.removeAttribute("src");
  await del(s.id);
  songs.splice(cur, 1);
  cur = -1;
  $("#mini").style.display = "none";
  setSheet(false);
  render();
};
$("#vol").oninput = e => { au.volume = e.target.value / 100; e.target.style.setProperty("--p", e.target.value + "%"); };

let ut = 0;
const lyr = $("#lyr");
const usr = () => {
  lyr.classList.add("user");
  clearTimeout(ut);
  ut = setTimeout(() => { lyr.classList.remove("user"); ai = -2; sync(); }, 2600);
};
["touchstart", "touchmove", "touchend", "wheel"].forEach(ev => lyr.addEventListener(ev, usr, { passive: true }));

/* Boot */
$("#mp").innerHTML = I.play;
$("#pp").innerHTML = I.play;
$("#mn").innerHTML = I.next;
$("#nx").innerHTML = I.ffw;
$("#pv").innerHTML = I.rew;
$("#sh").innerHTML = I.shuf;
$("#rp").innerHTML = I.rep;
render();
openDB().then(async d => {
  db = d;
  const all = await tx("readonly", o => o.getAll());
  if (all && all.length) {
    songs = all.sort((a, b) => a.id < b.id ? -1 : 1);
    render();
  }
});
</script>

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
